name: Sync Front-End to GitLab A705

on:
  push:
    branches:
      - master # Trigger when master branch is updated

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout github-repo
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "wndgur76@naver.com"

      - name: Clone GitLab A705
        run: |
          git clone https://oauth2:${{ secrets.GITLAB_PAT }}@lab.ssafy.com/s12-webmobile2-sub1/S12P11A705.git A705
          cd A705
          git config user.email "dkandjsl@gmail.com"
          git config user.name "GitHub Actions"

      - name: Create or Switch to 'FE-sync' branch
        run: |
          cd A705
          if git rev-parse --verify FE-sync; then
            git checkout FE-sync  # Switch to existing FE-sync branch
            git merge --ff-only origin/FE-sync || echo "No fast-forward merge possible, trying rebase..."
            git rebase origin/FE-sync || echo "Rebase failed, continuing with push"
          else
            git checkout -b FE-sync  # Create new FE-sync branch
          fi

      - name: Copy github-repo to A705/Front-End
        run: |
          rm -rf A705/Front-End  # Remove old Front-End folder if exists
          mkdir -p A705/Front-End
          rsync -av --exclude=A705 --exclude=.git ./ A705/Front-End/  # Copy everything except A705 and .git
          cd A705
          git add Front-End/
          git commit -m "Sync Front-End from github-repo [$(date)]" || echo "No changes to commit"
          git pull origin FE-sync  # Pull to avoid conflicts
          git push origin FE-sync  # Push to FE-sync branch
